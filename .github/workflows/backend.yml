name: Build Backend

# We want this workflow to be only triggered for changes to the backend
on:
  push:
    paths:
      - './backend/**'
  pull_request:
    paths:
      - './backend/**'
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build
      run: mvn -B verify
